name: Build, test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - run: npm ci
      - name: Prepare Rust WebAssembly toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Test and rebuild the PhaseSmith importer
        run: |
          cargo test --locked --manifest-path engine/Cargo.toml
          npm run build:engine
      - name: Geometry and view tests
        run: node --test tests/*.test.mjs
      - name: Production build for GitHub Pages
        run: npm run build -- --base "$VITE_BASE_PATH"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test the hosted path, WebAssembly engine, stable layout and tool windows
        shell: bash
        run: |
          set -eu
          viewer_site_root="$(mktemp -d)"
          mkdir -p "$viewer_site_root$VITE_BASE_PATH"
          cp -a dist/. "$viewer_site_root$VITE_BASE_PATH"
          python -m http.server 4181 --bind 127.0.0.1 --directory "$viewer_site_root" > /tmp/viewer-pages-test.log 2>&1 &
          viewer_server_pid=$!
          trap 'kill "$viewer_server_pid"; rm -rf "$viewer_site_root"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS "http://127.0.0.1:4181$VITE_BASE_PATH" > /dev/null
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/pages_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/library_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/pair_defaults_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/symmetry_selection_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/history_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/touch_pan_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/project_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/layout_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/page_zoom_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/tool_windows_smoke.py
          VIEWER_URL="http://127.0.0.1:4181${VITE_BASE_PATH%/}" python tests/turn_smoke.py
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
